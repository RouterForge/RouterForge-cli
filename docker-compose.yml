version: "3.8"

services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      # Mount the project root into the container for live code updates
      - .:/app
    environment:
      - GO111MODULE=on
      - PORT=8080
      - DATABASE_URL=postgres://postgres:postgres@db:5432/big_pickle?sslmode=disable
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: big_pickle
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: